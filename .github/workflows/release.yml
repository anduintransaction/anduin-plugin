name: Release

# Every release tag vX.Y.Z gets an immutable vX.Y.Z-eu tag whose plugins/anduin points at
# the EU server, plus a GitHub Release with paste-ready refs, one ZIP per region and the admin guide PDF.
# The Release is a draft until every asset is attached: once published it is immutable (tag and assets locked).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate release
        run: |
          version="$(python3 -c 'import json; print(json.load(open("plugins/anduin/.claude-plugin/plugin.json"))["version"])')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match plugin.json version $version" >&2
            exit 1
          fi
          scripts/build-eu-plugin.sh --check
          echo "version=$version" >> "$GITHUB_ENV"
      - name: Build release assets
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          scripts/build-eu-plugin.sh "$RUNNER_TEMP/anduin-eu"
          (cd plugins/anduin && zip -qr "$RUNNER_TEMP/assets/anduin-us-$version.zip" .)
          (cd "$RUNNER_TEMP/anduin-eu" && zip -qr "$RUNNER_TEMP/assets/anduin-eu-$version.zip" .)
          scripts/render-guide.sh "$RUNNER_TEMP/assets/Anduin_MCP_Enablement_Guide_Claude.pdf"
      - name: Publish the EU tag
        run: |
          eu="${GITHUB_REF_NAME}-eu"
          if git fetch --quiet origin "refs/tags/$eu:refs/tags/$eu" 2>/dev/null; then
            # Reuse an existing tag only if it is this release's EU build.
            if [[ "$(git rev-parse "$eu^{commit}^")" != "$GITHUB_SHA" ]]; then
              echo "$eu already exists but was not built from $GITHUB_REF_NAME; refusing to overwrite" >&2
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/existing"
            git archive "$eu" plugins/anduin | tar -x -C "$RUNNER_TEMP/existing"
            if ! diff -r "$RUNNER_TEMP/existing/plugins/anduin" "$RUNNER_TEMP/anduin-eu"; then
              echo "$eu does not match a fresh EU build of $GITHUB_REF_NAME; refusing to reuse it" >&2
              exit 1
            fi
            echo "$eu already published from this release"
          else
            scripts/build-eu-plugin.sh plugins/anduin
            test "$(python3 -c 'import json; print(json.load(open("plugins/anduin/.mcp.json"))["mcpServers"]["anduin"]["url"])')" = "https://mcp.eu.anduin.app/mcp"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A plugins/anduin
            git commit -m "build: EU variant of ${GITHUB_REF_NAME}"
            git tag -a "$eu" -m "EU build of ${GITHUB_REF_NAME}"
            git push origin "refs/tags/$eu"
          fi
          echo "eu_sha=$(git rev-parse "$eu^{commit}")" >> "$GITHUB_ENV"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          python3 scripts/release-notes.py "$version" "$GITHUB_SHA" "$eu_sha" > "$RUNNER_TEMP/notes.md"
          expected="$(ls "$RUNNER_TEMP/assets" | sort)"
          attached() { gh release view "$tag" --json assets --jq '.assets[].name' | sort; }
          state="$(gh release view "$tag" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)"
          case "$state" in
            none)
              gh release create "$tag" --draft --verify-tag --title "$tag" \
                --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/assets/*
              ;;
            draft)
              # A previous run died before publishing; a draft is still mutable, so finish it.
              gh release upload "$tag" "$RUNNER_TEMP"/assets/* --clobber
              gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
              ;;
            published)
              if [[ "$(attached)" == "$expected" ]]; then
                echo "$tag is already published with every asset; nothing to do"
                exit 0
              fi
              # Assets of a published release cannot change, and a deleted release's tag name cannot be reused.
              echo "$tag is published with assets [$(attached | xargs)] but this build has [$(xargs <<<"$expected")]; release the next patch version" >&2
              exit 1
              ;;
          esac
          if [[ "$(attached)" != "$expected" ]]; then
            echo "draft $tag holds [$(attached | xargs)] but this build has [$(xargs <<<"$expected")]; re-run this workflow" >&2
            exit 1
          fi
          gh release edit "$tag" --draft=false --latest
          if [[ "$(gh release view "$tag" --json isImmutable --jq .isImmutable)" == "true" ]]; then
            # Notes stay editable after publish; now that the attestation exists, tell customers how to verify.
            python3 scripts/release-notes.py "$version" "$GITHUB_SHA" "$eu_sha" --immutable > "$RUNNER_TEMP/notes.md"
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
            echo "Published $tag as an immutable release" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::$tag was published mutable; enable Settings → General → Releases → Immutable releases"
          fi
