name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/build-eu-plugin.sh --check
      - name: EU build succeeds
        run: scripts/build-eu-plugin.sh "$RUNNER_TEMP/anduin-eu" && cat "$RUNNER_TEMP/anduin-eu/.mcp.json"

  web-builder-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/anduin-web-builder/server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Bundle matches source
        run: npm run build && git diff --exit-code dist/server.mjs
