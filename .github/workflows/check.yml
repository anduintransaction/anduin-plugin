name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/build-eu-plugin.sh --check
      - name: EU build succeeds
        run: scripts/build-eu-plugin.sh "$RUNNER_TEMP/anduin-eu" && cat "$RUNNER_TEMP/anduin-eu/.mcp.json"

  web-builder-connector:
    # macOS: build.sh joins the two Mac builds with lipo.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: plugins/anduin-web-builder/connector
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugins/anduin-web-builder/connector/go.mod
          cache-dependency-path: plugins/anduin-web-builder/connector/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: Packed connector matches source
        run: ./build.sh && git diff --exit-code ../anduin-builder.mcpb
